<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vokabel-Akte">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>

<body>
<title>Konrads Vokabel-Akte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Special+Elite&display=swap">
<style>
/* Layout: one narrow column like a police case file on a phone; highlighter labels from the textbook, a red stamp for solved cases */
:root{
  --bg:#EDF0F7; --card:#FFFFFF; --ink:#1B2140; --muted:#5B6385; --line:#D5DAE8;
  --blue:#2F45A8; --blue-soft:#E3E8FA; --hi:#FFD23F; --hi-ink:#1B2140;
  --ok:#1F8A5B; --ok-soft:#DDF3E8; --bad:#C8402F; --bad-soft:#FBE3DF;
  --f-display:"Special Elite","Courier New",ui-monospace,monospace;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12162B; --card:#1C2242; --ink:#E9ECF7; --muted:#9AA3C7; --line:#2D3561;
  --blue:#8EA2FF; --blue-soft:#253066; --hi:#FFD23F; --hi-ink:#1B2140;
  --ok:#4CC38A; --ok-soft:#163A2B; --bad:#FF7A66; --bad-soft:#4A221C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12162B; --card:#1C2242; --ink:#E9ECF7; --muted:#9AA3C7; --line:#2D3561;
  --blue:#8EA2FF; --blue-soft:#253066; --hi:#FFD23F; --hi-ink:#1B2140;
  --ok:#4CC38A; --ok-soft:#163A2B; --bad:#FF7A66; --bad-soft:#4A221C; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;padding:16px;padding-block:16px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.display{font-family:var(--f-display);font-weight:400}
.mark{background:var(--hi);color:var(--hi-ink);padding:.05em .4em;border-radius:6px;display:inline-block;transform:rotate(-1.5deg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 18px;font-weight:700;color:inherit;background:var(--blue-soft)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.btn-main{background:var(--blue);color:var(--card);font-size:18px;width:100%}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
.tnum{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top h1{font-family:var(--f-display);font-size:30px;line-height:1.1}
.unit{font-size:13px;color:var(--muted)}

/* progress */
.meter{height:14px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.big{font-family:var(--f-display);font-size:44px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}

/* level 2 */
.lock{display:flex;gap:14px;align-items:center}
.lock .pad{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--bg);font-family:var(--f-display);font-size:22px}

/* word list */
details summary{cursor:pointer;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
.words{display:grid;gap:6px;margin-top:12px}
.w{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.w:last-child{border:0}
.w .de{color:var(--muted);text-align:right}
.boxes{display:inline-flex;gap:3px;margin-right:8px;vertical-align:1px}
.boxes i{width:8px;height:8px;border-radius:2px;background:var(--line)}
.boxes i.on{background:var(--ok)}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.qbar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--blue);transition:width .3s}
.prompt{position:relative;padding:26px 18px 22px;text-align:center}
.prompt .de-word{font-size:28px;font-weight:700;margin:8px 0 2px;text-wrap:balance}
.prompt .hint{margin-top:12px;font-size:15px;color:var(--muted);font-style:italic}
.answer{width:100%;font:inherit;font-size:22px;padding:14px 16px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:center}
.answer.ok{border-color:var(--ok);background:var(--ok-soft)}
.answer.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:12px;padding:14px 16px;font-size:16px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb .right{font-size:22px;font-weight:700;letter-spacing:.02em}
.miss{color:var(--bad);text-decoration:underline;text-decoration-thickness:3px}
.stamp{position:absolute;right:12px;top:10px;font-family:var(--f-display);color:var(--bad);border:3px solid var(--bad);border-radius:8px;padding:2px 10px;font-size:20px;transform:rotate(12deg) scale(1.6);opacity:0;pointer-events:none}
.stamp.show{animation:stamp .35s ease-out forwards}
@keyframes stamp{to{transform:rotate(12deg) scale(1);opacity:.9}}
@media (prefers-reduced-motion:reduce){.stamp.show{animation:none;transform:rotate(12deg);opacity:.9}.qbar i{transition:none}}

/* result */
.result{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.result .score{font-family:var(--f-display);font-size:56px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:14px;padding:4px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
.chip.up{border-color:var(--ok);color:var(--ok)}

/* history */
.hist{display:flex;align-items:flex-end;gap:4px;height:70px;margin-top:12px}
.hist .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;min-width:0}
.hist .b i{display:block;width:100%;max-width:22px;border-radius:4px 4px 0 0;background:var(--blue)}
.hist .b span{font-size:10px;color:var(--muted)}
.log{font-size:14px;margin-top:10px;display:grid;gap:4px}
.log div{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}

textarea.para{width:100%;min-height:110px;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.checks{display:grid;gap:6px;font-size:15px}
.checks div::before{content:"○ ";color:var(--muted)}
.checks div.y::before{content:"✓ ";color:var(--ok);font-weight:700}
.checks div.n::before{content:"✗ ";color:var(--bad);font-weight:700}
.starters{display:flex;flex-wrap:wrap;gap:6px}
.starters button{padding:6px 10px;font-size:14px;font-weight:400;border-radius:99px}
.model{border-left:4px solid var(--hi);padding:4px 0 4px 12px;font-style:italic}
.confirm{background:var(--bad-soft);border-radius:12px;padding:12px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:5}

/* past perfect */
.formula{font-size:26px;font-weight:700}
.ppw{background:var(--hi);color:var(--hi-ink);padding:0 .25em;border-radius:4px}
.tl{position:relative;height:74px;margin:4px 0}
.tl-line{position:absolute;left:0;right:0;top:12px;height:3px;background:var(--line)}
.tl-line::after{content:"";position:absolute;right:-2px;top:-5px;border:6px solid transparent;border-left:9px solid var(--line)}
.tl-pt{position:absolute;top:4px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.tl-pt i{width:19px;height:19px;border-radius:50%;background:var(--blue);border:3px solid var(--card)}
.tl-pt.first i{background:var(--hi)}
.tl-pt span{color:var(--muted)}
.tl-now{position:absolute;right:0;top:24px;font-size:13px;color:var(--muted)}
.cue{font-size:21px;font-weight:700;margin-top:10px;text-wrap:balance}
.blank{display:inline-block;min-width:3em;border-bottom:3px solid var(--hi);color:var(--muted)}
.answer.long{font-size:18px;text-align:left}
table.irr{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
table.irr th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:6px 4px}
table.irr td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}

/* probe test */
.tsec{display:grid;gap:4px}
.trow{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.trow:last-child{border:0}
.trow.res{align-items:start}
.tin{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.tex{display:grid;gap:6px;margin-top:14px}
.mk{font-weight:700;margin-right:4px}
.mk.ok{color:var(--ok)} .mk.half{color:#C98A00} .mk.bad{color:var(--bad)}
.rate button{padding:8px 12px;font-size:15px}
.rate button.sel{background:var(--blue);color:var(--card)}
.ampel{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%}
.ampel i{height:36px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-weight:700;color:#1B2140;opacity:.3}
.ampel i.on{opacity:1;outline:3px solid var(--ink);outline-offset:1px}
.sk{display:grid;gap:6px}
.dlog{display:grid;gap:6px;width:100%}
.dlog div{display:flex;justify-content:space-between;background:var(--bg);border-radius:10px;padding:10px 14px}
.small{font-size:14px}
</style>

<canvas id="confetti"></canvas>
<div class="wrap" id="app"></div>

<script>
const FOOD = [
 {en:"diet",de:"Ernährung; Diät",ex:"To stay fit, you need a healthy diet.",def:"the food that you usually eat"},
 {en:"to afford",de:"sich leisten",ex:"We can't afford to go abroad this summer.",def:"to have enough money to pay for something"},
 {en:"cause",de:"Ursache",ex:"Poverty is the main cause of hunger.",def:"the thing that makes something happen"},
 {en:"to face",de:"konfrontieren; gegenüberstehen",ex:"Millions of people face hunger in poor countries.",def:"to have a difficult situation or problem in front of you"},
 {en:"to feed",de:"ernähren; füttern",ex:"They have a large family to feed.",def:"to give food to a person or an animal"},
 {en:"intake",de:"Einnahme; Aufnahme",ex:"People in America have a higher intake of calories than people in Africa.",def:"the amount of food or drink that you take into your body"},
 {en:"poverty",de:"Armut",ex:"Millions of people live in extreme poverty worldwide.",def:"when people have very little money and cannot buy the things they need"},
 {en:"to waste",de:"verschwenden",ex:"We need to waste less food in order to feed the population.",def:"to use more of something than you need, or to throw away something that is still good"},
 {en:"advert",alt:["advertisement"],de:"Reklame; Anzeige; Werbung",ex:"You want to sell your car? I saw your advert in the local newspaper.",def:"a picture, a short text or a film that wants you to buy something"},
 {en:"to contain",de:"beinhalten; enthalten",ex:"Some fizzy drinks contain 35 g of sugar.",def:"to have something inside"},
 {en:"cookery",de:"Kochen; Kochkunst",ex:"Learn to cook by watching a cookery programme.",def:"the art of making food"},
 {en:"fortunately",de:"glücklicherweise; zum Glück",ex:"Fortunately, we arrived at the train station just in time to catch our train.",def:"luckily, something good happened"},
 {en:"health",de:"Gesundheit",ex:"Everyone needs a minimum intake of calories per day for good health.",def:"how well your body and your mind are"},
 {en:"ingredient",de:"Zutat",ex:"A recipe gives you a list of ingredients to use.",def:"one of the foods you use to make a dish"},
 {en:"nutrition",de:"Ernährung",ex:"Good nutrition means eating good food regularly.",def:"the food your body needs to grow and to stay healthy"},
 {en:"overweight",de:"übergewichtig",ex:"If you eat too much too often, you will soon be overweight.",def:"heavier than is healthy"},
 {en:"well-known",alt:["well known"],de:"wohlbekannt, berühmt",ex:"Jamie Oliver is a well-known chef.",def:"known by a lot of people, famous"},
 {en:"man-made",alt:["man made"],de:"künstlich",ex:"Artificial food isn't natural – it's man-made.",def:"made by people, not by nature"},
 {en:"to dislike",de:"nicht mögen, nicht leiden können",ex:"I like tomatoes, but I dislike spinach.",def:"to not like something"},
 {en:"to be in charge",de:"das Sagen haben, verantwortlich sein",ex:"You need to talk to Mara. She is in charge of the food festival.",def:"to be the person who decides and who is responsible"},
 {en:"disgusting",de:"ekelhaft, widerlich",ex:"Pasta with ketchup? That sounds disgusting!",def:"very bad, so that you feel a little sick"},
 {en:"home-cooked",alt:["home cooked"],de:"selbstgekocht",ex:"The food at the school's food festival should be fresh and home-cooked.",def:"made at home, not in a factory or a restaurant"},
 {en:"Let's get started",alt:["let us get started","lets get started"],de:"Lasst uns anfangen; Packen wir's an",ex:"Thank you for coming to the meeting – let's get started right away.",def:"we say this when we want to begin something together"},
 {en:"to persuade",de:"überzeugen",ex:"We need a good poster to persuade as many kids as possible to take part in the project.",def:"to make someone want to do or believe something"},
 {en:"to wait and see",de:"abwarten",ex:"We'll have to wait and see.",def:"to wait to find out what will happen"},
 {en:"to fold",de:"zusammenklappen, falten",ex:"Pick up the pan and fold the omelette.",def:"to bend something so that one part lies on top of the other part"},
 {en:"gently",de:"sanft, behutsam",ex:"Stir the soup gently.",def:"in a soft and careful way"},
 {en:"oil",de:"Öl",ex:"Would you like some olive oil in your salad?",def:"a yellow liquid from plants that you use for cooking"},
 {en:"pan",de:"Pfanne",ex:"Heat some oil in a pan.",def:"a round metal thing that you use to cook food on the stove"},
 {en:"to pour",de:"schütten, gießen",ex:"Beat the eggs in a cup and pour them into the pan.",def:"to make a liquid flow out of a cup or a bottle"},
 {en:"to stir",de:"rühren, umrühren",ex:"He used a spoon to stir the soup.",def:"to move a spoon round and round in a liquid"},
 {en:"donation",de:"Spende",ex:"She made a big donation to the local animal shelter.",def:"money or things that you give to help people or animals"}
];
const CRIME = [
 // Word File: Crime
 {en:"criminal",de:"Kriminelle/r",ex:"The police caught the criminal after a long chase.",def:"a person who does something that is against the law"},
 {en:"thief",de:"Dieb/Diebin",ex:"The thief stole my bike from the school yard.",def:"a person who takes things that do not belong to him or her"},
 {en:"victim",de:"Opfer",ex:"The victim of the scam lost a lot of money.",def:"a person who is hurt or harmed by a crime"},
 {en:"to commit",de:"begehen (ein Verbrechen)",ex:"She studies how AI is used to commit crimes.",def:"to do something bad or illegal, for example a crime"},
 {en:"to arrest",de:"verhaften, festnehmen",ex:"The police arrested the man at the airport.",def:"when the police take a person away because they think the person did a crime"},
 {en:"to blackmail",de:"erpressen",ex:"He tried to blackmail her with secret photos.",def:"to say you will tell a person's secret if they don't give you money"},
 {en:"scam",de:"Betrug, Schwindel",ex:"The email about the free phone was a scam.",def:"a dishonest trick to get people's money"},
 {en:"personal data",de:"persönliche Daten",ex:"Never share your personal data with strangers online.",def:"information about you, like your name, your address or your birthday"},
 {en:"fake",de:"gefälscht, unecht",ex:"This bag looks expensive, but it is fake.",def:"not real, but made to look real"},
 // MORE Words and Phrases
 {en:"AI",alt:["artificial intelligence","ai (artificial intelligence)"],de:"KI (künstliche Intelligenz)",ex:"She studies how AI is used to commit crimes.",def:"a computer program that can think and learn a bit like a human"},
 {en:"data",de:"Daten",ex:"We regularly warn people about phishing mails and data theft.",def:"facts and information, often stored on a computer"},
 {en:"in recent years",de:"in den letzten Jahren",ex:"In recent years, cyber scams have increased.",def:"during the last few years until now"},
 {en:"to increase",de:"ansteigen, zunehmen",ex:"As technology gets better, cybercrime is increasing.",def:"to become bigger or more"},
 {en:"particular",de:"bestimmt; speziell; besonders",ex:"We are looking for a person who was in a particular area of town on a particular day.",def:"one special thing and not any other"},
 {en:"regularly",de:"regelmäßig",ex:"We regularly warn people about phishing attacks.",def:"again and again, often at the same times"},
 // Wortliste
 {en:"to break into",de:"einbrechen",ex:"Thieves break into houses and steal valuable things.",def:"to get into a building in an illegal way, for example through a window, to steal something"},
 {en:"to confirm",de:"bestätigen",ex:"The police can confirm what I've told you.",def:"to say that something is really true"},
 {en:"jewellery",near:["jewelry"],de:"Schmuck",ex:"All my money, all my jewellery is gone.",def:"things like rings, necklaces and earrings that people wear"},
 {en:"suspicious",de:"verdächtig",ex:"The police didn't wear a uniform because they didn't want the criminals to become suspicious.",def:"when you think that someone did something wrong or is not honest"},
 {en:"to confess",de:"gestehen, beichten",ex:"We arrested the thief but she didn't confess.",def:"to say that you did something wrong"},
 {en:"purpose",de:"Absicht, Zweck, Ziel",ex:"Her main purpose in life is to help others.",def:"the reason why you do something"},
 {en:"account",de:"Konto",ex:"Somebody hacked into my Facebook account.",def:"your own personal place on a website or at a bank, you often need a password for it"},
 {en:"common",de:"häufig; gewöhnlich",ex:"One of the most common passwords people use is Password.",def:"something you find or see very often"},
 {en:"to access",de:"einsteigen; zugreifen",ex:"A hacker needs your password to access your personal accounts.",def:"to get into something, like a computer or a website"},
 {en:"to consist of",de:"sich aus etw. zusammensetzen",ex:"Most websites ask for a password that consists of eight characters.",def:"to be made of different parts"},
 {en:"invisible",de:"unsichtbar",ex:"Cybercrimes are often invisible. Not many people can see them.",def:"something you cannot see"},
 {en:"to keep in contact",de:"in Kontakt bleiben",ex:"A lot of people regularly use social media to keep in contact with friends.",def:"to still talk or write to people, even if you don't see them often"},
 {en:"weapon",de:"Waffe",ex:"A hacker's weapon is the computer.",def:"a thing like a gun or a knife that people use to hurt others"},
 {en:"witness",de:"Zeuge/Zeugin",ex:"There are often no witnesses to cybercrimes.",def:"a person who sees a crime or an accident happen"},
 {en:"advantage",de:"Vorteil",ex:"AI has many advantages and it can help to solve crimes.",def:"something good that helps you"},
 {en:"to look into",de:"nachforschen, ermitteln",ex:"The police said that they would look into the cybercrime case.",def:"to try to find out the facts about something"},
 {en:"police department",de:"Polizeibehörde",ex:"The police department we work with uses AI to find out where crimes happened.",def:"the office or organisation of the police in a town or city"},
 {en:"to predict",de:"voraussagen",ex:"AI can predict what criminals may do in the future.",def:"to say what will happen in the future"},
 {en:"to reduce",de:"reduzieren, verringern",ex:"They are working together to reduce cybercrime incidents.",def:"to make something smaller or less"},
 {en:"violence",de:"Gewalt",ex:"The police were able to reduce gun violence incidents by 47%.",def:"when people hurt other people with their body or with weapons"},
 {en:"ID",de:"Ausweis",ex:"He used a fake ID to get into the club.",def:"a card with your name and photo that shows who you are"},
 {en:"pattern",de:"Muster",ex:"The story follows a certain pattern.",def:"something that happens again and again in the same way"},
 {en:"tiring",de:"ermüdend, anstrengend",ex:"It had been a tiring day, and he could finally sit down.",def:"something that makes you feel tired"},
 {en:"imagination",de:"Vorstellungskraft, Einbildung",ex:"Use your imagination to write a story.",def:"the ability to make pictures and ideas in your head"},
 {en:"complaint",de:"Beschwerde",ex:"She went back to the shop to make a complaint.",def:"when you say that you are not happy with something, for example in a shop"},
 {en:"misunderstanding",de:"Missverständnis",ex:"I'm sorry for the misunderstanding. Here are your new headphones.",def:"when two people understand something in different ways"},
 {en:"receipt",de:"Quittung, Kassenbon",ex:"Sorry, I can't take these back without a receipt.",def:"a piece of paper from a shop that shows what you paid"},
 {en:"to regret",de:"bereuen",ex:"That man is going to regret not taking me seriously.",def:"to feel sorry or sad about something you did"}
];
const MASTER = 1, ROUND = 5, KEY = "konrad-vokabel-akte-v1";

/* ---------- state ---------- */
function freshState(){return {w:{},hist:[],paraDone:0,guessOk:0,gramOk:0,unit:"food",ex:{},pp:{}}} // ex: words explained well, pp: grammar sentences solved
let S = freshState();
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(freshState(),JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ws(en){return S.w[en]||(S.w[en]={box:0,ok:0,bad:0})}
const today=()=>new Date().toISOString().slice(0,10);
const masteredCount=()=>WORDS.filter(w=>ws(w.en).box>=MASTER).length;

/* ---------- units ---------- */
// order as on the photos: Crime photo 1 = list, photo 2 = Word File + MORE Words and Phrases
const UNITS={
  food:{label:"Food",eyebrow:"Neue Unit · Wortliste",words:FOOD,groups:[{name:"Wortliste Food",from:0,to:FOOD.length}]},
  crime:{label:"Crime",eyebrow:"Unit 2 · Word File",words:CRIME,groups:[{name:"Bild 1 · Wortliste",from:15,to:43},{name:"Bild 2 · Word File Crime",from:0,to:9},{name:"Bild 2 · More Words and Phrases",from:9,to:15}]}
};
if(!UNITS[S.unit]) S.unit="food";
let WORDS=UNITS[S.unit].words, GROUPS=UNITS[S.unit].groups;
function setUnit(u){S.unit=u;save();WORDS=UNITS[u].words;GROUPS=UNITS[u].groups;home();scrollTo(0,0)}
let FLOW=null; // daily training: several modules in a row

/* ---------- text helpers ---------- */
const norm=s=>s.toLowerCase().replace(/[’`´]/g,"'").replace(/\s+/g," ").replace(/[.!?]+$/,"").trim();
const noTo=s=>s.replace(/^to /,"");
function lev(a,b){const d=[...Array(b.length+1).keys()];for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]}
function check(w,input){
  const a=norm(input), targets=[w.en,...(w.alt||[])].map(norm);
  if(!a) return {r:"empty"};
  if(targets.includes(a)) return {r:"ok"};
  if(targets.some(t=>t.startsWith("to ")&&noTo(t)===a)) return {r:"ok",note:"Merk dir das „to“ davor: "+w.en};
  if((w.near||[]).map(norm).includes(a)) return {r:"near",note:"Das ist amerikanisch. In deinem Buch steht die britische Schreibweise."};
  const dist=Math.min(...targets.map(t=>Math.min(lev(a,t),lev(a,noTo(t)))));
  if(dist<=2 && norm(w.en).length>3) return {r:"near"};
  return {r:"bad"};
}
// English -> German: any one of the listed meanings counts, articles and small typos are forgiven
const deN=s=>s.toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss").replace(/[.!?,;]/g," ")
  .replace(/\b(der|die|das|den|dem|ein|eine|einen|sich|etw|etwas)\b/g," ").replace(/\s+/g," ").trim();
function deOptions(w){
  const out=new Set();
  w.de.split(/[,;]/).forEach(part=>{
    part=part.trim(); const inner=(part.match(/\(([^)]*)\)/)||[])[1]; const bare=part.replace(/\s*\([^)]*\)/,"").trim();
    [part,bare,inner].filter(Boolean).forEach(x=>{
      out.add(x);
      const m=x.match(/^(.*?)(\S+)\/(\S+)$/);
      if(m){ const [_,pre,a,b]=m; if(b.length<=2){out.add(pre+a);out.add(pre+a+b)} else {out.add(pre+a);out.add(pre+b)} }
    });
  });
  return [...out].map(deN).filter(Boolean);
}
function checkDe(w,input){
  const a=deN(input); if(!input.trim()) return {r:"empty"};
  const opts=deOptions(w);
  if(opts.includes(a)||opts.some(o=>!o.includes(" ")&&o.length>3&&a.split(" ").includes(o))) return {r:"ok"};
  if(a.length>4&&opts.some(o=>lev(a,o)<=1)) return {r:"ok",note:"Kleiner Tippfehler. Gemeint ist: "+w.de};
  return {r:"bad"};
}
// mark the letters of the right answer that the attempt missed (LCS)
function diffHTML(right,attempt){
  const a=right, b=norm(attempt), A=a.toLowerCase();
  const L=[...Array(A.length+1)].map(()=>Array(b.length+1).fill(0));
  for(let i=A.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)L[i][j]=A[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0,out="";
  while(i<A.length){ if(j<b.length&&A[i]===b[j]){out+=esc(a[i]);i++;j++} else if(j<b.length&&L[i][j+1]>=L[i+1][j]){j++} else {out+='<span class="miss">'+esc(a[i])+'</span>';i++} }
  return out;
}
function gap(w){
  const core=noTo(w.en).replace(/\s*\(.*\)/,""); const parts=core.split(" ");
  const first=parts[0].replace(/e$/,"").replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  const re=new RegExp("\\b"+first+"\\w*"+(parts.length>1?"\\s+"+parts.slice(1).join("\\s+"):"")+"\\b","i");
  return re.test(w.ex)? w.ex.replace(re,"_____") : null;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- streak ---------- */
function streak(){
  const days=new Set(S.hist.map(h=>h.d)); let n=0; const d=new Date();
  if(!days.has(today())) d.setDate(d.getDate()-1);
  while(days.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}
  return n;
}

/* ---------- vocabulary round ---------- */
let R=null;
function pickRound(){
  const open=WORDS.filter(w=>ws(w.en).box<MASTER), done=WORDS.filter(w=>ws(w.en).box>=MASTER);
  // started words first (lowest box), then new ones, then 1–2 review words
  const started=shuffle(open.filter(w=>ws(w.en).box>0)).sort((a,b)=>ws(a.en).box-ws(b.en).box);
  const fresh=shuffle(open.filter(w=>ws(w.en).box===0));
  let pick=[...started.slice(0,6),...fresh].slice(0,ROUND-Math.min(2,done.length));
  if(pick.length<ROUND-2) pick=[...started,...fresh].slice(0,ROUND-2);
  pick=[...pick,...shuffle(done).slice(0,ROUND-pick.length)];
  return shuffle(pick.slice(0,ROUND));
}
function startRound(){
  const q=pickRound(); R={q, i:0, total:q.length, first:new Map(), up:[], hinted:new Set(), retype:false, wrongs:0,
    rev:new Map(q.map(w=>[w.en,Math.random()<.5]))}; // about half the words are asked English -> German
  ask();
}
function ask(){
  if(R.i>=R.q.length) return finish();
  const w=R.q[R.i], done=Math.min(R.first.size,R.total);
  const g=gap(w), rev=R.rev.get(w.en);
  app.innerHTML=`
  <div class="qhead"><button class="btn-ghost" id="quit" aria-label="Runde beenden">✕</button><div class="qbar"><i style="width:${done/R.total*100}%"></i></div><span class="tnum muted small">${done}/${R.total}</span></div>
  <section class="card prompt">
    <span class="stamp" id="stamp">GELÖST</span>
    <div class="eyebrow">Wie heißt das auf ${rev?"Deutsch":"Englisch"}?</div>
    <div class="de-word">${rev?`<span class="mark">${esc(w.en)}</span>`:esc(w.de)}</div>
    <div class="hint" id="hint" hidden></div>
  </section>
  <form id="f" style="display:grid;gap:12px" autocomplete="off">
    <input class="answer" id="ans" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="${R.retype?"Schreib es richtig ab":rev?"auf Deutsch tippen":"auf Englisch tippen"}">
    <div id="fb"></div>
    <div class="row" id="btns"><button class="btn-main" style="flex:1" id="send">Prüfen</button>${R.retype?"":'<button type="button" id="tip" class="btn-ghost">Tipp</button>'}</div>
  </form>`;
  const inp=$("ans"); inp.focus();
  $("quit").onclick=()=>{ FLOW=null; if(R.first.size) finish(); else home() };
  if($("tip")) $("tip").onclick=()=>{R.hinted.add(w.en);const h=$("hint");h.hidden=false;
    h.innerHTML=rev? "„"+esc(w.ex)+"“<br>Fängt an mit <b>"+esc(w.de[0])+"</b>"
      : (g?"„"+esc(g)+"“<br>":"")+"Fängt an mit <b>"+esc(noTo(w.en)[0])+"</b>, "+noTo(w.en).length+" Zeichen";
    const t=$("tip");t.textContent="Lösung zeigen";t.onclick=()=>evaluate(w,inp.value,true);inp.focus()};
  $("f").onsubmit=e=>{e.preventDefault(); evaluate(w,inp.value)};
}
function evaluate(w,val,giveUp){
  const rev=R.rev.get(w.en), sol=rev?w.de:w.en;
  const res=giveUp?{r:"giveup"}:rev?checkDe(w,val):check(w,val), inp=$("ans"), fb=$("fb");
  if(res.r==="empty"){inp.focus();return}
  if(R.retype){ // must type the right answer once after a mistake
    if(res.r==="ok"){R.retype=false;R.i++;ask()} else {inp.classList.add("bad");inp.value="";fb.innerHTML=`<div class="fb bad">Noch nicht ganz. Richtig: <b>${esc(sol)}</b></div>`;inp.focus()}
    return;
  }
  const firstTry=!R.first.has(w.en); const s=ws(w.en);
  if(res.r==="ok"){
    if(firstTry){R.first.set(w.en,true); s.ok++}
    // easy mode: any correct answer (also with tip, also on the repeat at the end) solves the word
    if(s.box<MASTER){s.box=MASTER; R.up.push(w.en)}
    save();
    inp.classList.add("ok"); inp.readOnly=true;
    $("stamp").classList.add("show");
    fb.innerHTML=`<div class="fb ok"><b>${pick(["Richtig!","Volltreffer!","Fall gelöst!","Sauber!","Genau so!"])}</b>${rev?` ${esc(w.en)} = ${esc(w.de)}`:""}${res.note?`<div class="small" style="margin-top:4px">${esc(res.note)}</div>`:""}<div class="small tnum" style="margin-top:4px">${masteredCount()} von ${WORDS.length} Wörtern sitzen</div></div>`;
    $("btns").innerHTML='<button class="btn-main" style="flex:1" id="next">Weiter</button>';
    const n=$("next"); n.focus(); n.onclick=e=>{e.preventDefault();R.i++;ask()};
  } else {
    if(firstTry){R.first.set(w.en,false); s.bad++; s.box=0; save()}
    R.wrongs++;
    R.q.push(w); // comes back at the end of the round
    inp.classList.add("bad");
    fb.innerHTML=`<div class="fb bad"><div class="small">${res.r==="near"?"Knapp daneben!":res.r==="giveup"?"Kein Problem, jetzt weißt du es.":"Leider falsch."} ${rev?"Auf Deutsch heißt es:":"So schreibt man es:"}</div><div class="right">${res.r==="giveup"||rev?esc(sol):diffHTML(w.en,val)}</div>${res.note?`<div class="small" style="margin-top:4px">${esc(res.note)}</div>`:""}<div class="small muted" style="margin-top:6px">${esc(w.ex)}</div></div>`;
    $("btns").innerHTML='<button class="btn-main" style="flex:1" id="next">Einmal richtig abschreiben</button>';
    const n=$("next"); n.focus(); n.onclick=e=>{e.preventDefault();R.retype=true;R.q.splice(R.i+1,0);ask()};
  }
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function finish(){
  const n=R.first.size, ok=[...R.first.values()].filter(Boolean).length;
  if(n){S.hist.push({d:today(),t:"v",n,ok,m:masteredCount(),u:S.unit});save()}
  if(FLOW) return flowNext({name:"Vokabeln",ok,n});
  const m=masteredCount(), pct=n?ok/n:0;
  const msg=pct===1?"Perfekte Runde!":pct>=.7?"Starke Runde!":pct>=.4?"Gut dran geblieben!":"Jede Runde zählt. Gleich nochmal?";
  app.innerHTML=`
  <section class="card result">
    <div class="eyebrow">Runde abgeschlossen</div>
    <div class="score tnum">${ok}/${n}</div>
    <div class="muted">beim ersten Versuch richtig</div>

const IRREG=[["be","was / were","been","sein"],["buy","bought","bought","kaufen"],["come","came","come","kommen"],["cut","cut","cut","schneiden"],["do","did","done","tun"],["drink","drank","drunk","trinken"],["eat","ate","eaten","essen"],["feed","fed","fed","füttern"],["find","found","found","finden"],["forget","forgot","forgotten","vergessen"],["get","got","got","bekommen"],["give","gave","given","geben"],["go","went","gone","gehen"],["have","had","had","haben"],["know","knew","known","wissen"],["leave","left","left","verlassen"],["make","made","made","machen"],["put","put","put","legen"],["see","saw","seen","sehen"],["sell","sold","sold","verkaufen"],["take","took","taken","nehmen"],["think","thought","thought","denken"],["write","wrote","written","schreiben"]];

const ppN=s=>norm(s).replace(/\bhad not\b/g,"hadn't").replace(/,/g,"");
function ppTip(it,a){
  if(it.pp){
    if(/\b(has|have)\b/.test(a)&&!/\bhad/.test(a)) return "has / have ist Present Perfect. Im Past Perfect heißt es immer <b>had</b>, für alle Personen.";
    if(/\b(was|were)\b/.test(a)&&!/\bhad/.test(a)) return "was / were ist hier falsch. Bauplan: <b>had + 3. Form</b>.";
    if(!/\bhad(n't)?\b/.test(a)) return "Da fehlt <b>had</b>. Bauplan: <b>had + 3. Form</b>.";
    if(!new RegExp("\\bhad(n't)?\\s+(\\w+\\s+){0,2}"+it.pp+"\\b").test(a)) return `Nach had kommt die <b>3. Form</b>: ${esc(it.v)} → <b>${esc(it.pp)}</b>`;
    return "";
  }
  if(/\bhad\b/.test(a)) return "Das passiert <b>danach</b>. Dafür reicht Past Simple, ohne had.";
  return `Past Simple von ${esc(it.v)}: <b>${esc(it.ps)}</b>`;
}
function ppCheck(it,input){
  const a=ppN(input), targets=[it.a,...(it.alt||[])].map(ppN);
  if(!a) return {r:"empty"};
  if(targets.includes(a)) return {r:"ok"};
  const tip=ppTip(it,a);
  if(!tip&&Math.min(...targets.map(t=>lev(a,t)))<=2) return {r:"near",tip:"Fast! Schau genau auf die Schreibweise."};
  if(!tip) return {r:"bad",tip:"Vergleich deinen Satz genau mit der Lösung: Reihenfolge und Wörter."};
  return {r:"bad",tip};
}

  <section class="card tsec"><h3>2 · Explain it in English</h3>
    <div class="small muted">Ohne das Wort selbst. Hilfe: It's a person who … / It's a thing that … / It means to …</div>
    ${T.ex.map((w,k)=>`<label class="tex"><b>${esc(w.en)}</b><textarea class="para" style="min-height:80px" id="e${k}" autocapitalize="sentences" spellcheck="false"></textarea></label>`).join("")}
  </section>
  <section class="card tsec"><h3>3 · Past Perfect</h3>
    <div class="small muted">Bau die Sätze im Past Perfect. Bei den Lücken: Past Perfect oder Past Simple?</div>
    ${T.gr.map((g,k)=>`<label class="tex"><span>${g.k==="b"?esc(g.c):esc(g.s)}</span><input class="tin" id="g${k}" placeholder="${g.k==="b"?"ganzer Satz":"Lücke"}" ${fld}></label>`).join("")}
  </section>
  <button class="btn-main" id="hand">Abgeben</button>`;
  $("back").onclick=home; $("hand").onclick=testGrade;
}
const MK={ok:'<span class="mk ok">✓</span>',half:'<span class="mk half">~</span>',bad:'<span class="mk bad">✗</span>'};
function testGrade(){
  let pts=0;
  // part 1: wrong words go back to "new", so they come up again in the vocab rounds
  const p1=T.tr.map((t,k)=>{const v=$("t"+k).value, r=v.trim()?(t.rev?checkDe(t.w,v):check(t.w,v)):{r:"bad"}, s=ws(t.w.en);
    const p=r.r==="ok"?1:r.r==="near"?.5:0; pts+=p;
    if(p<1){s.bad++;s.box=0} else s.box=MASTER;
    return `<div class="trow res"><span>${esc(t.rev?t.w.en:t.w.de)}</span><span>${p===1?MK.ok:p?MK.half:MK.bad} ${esc(v||"–")}${p<1?`<div class="small muted">richtig: <b>${esc(t.rev?t.w.de:t.w.en)}</b></div>`:""}</span></div>`}).join("");
  save();
  const p2=T.ex.map((w,k)=>{const v=$("e"+k).value.trim(), stem=noTo(w.en).toLowerCase().split(/[ -]/).sort((a,b)=>b.length-a.length)[0].replace(/e$/,"");
    const used=v.toLowerCase().includes(stem), short=v.split(/\s+/).filter(Boolean).length<6;
    T.rate[k]=v?null:0;
    return `<div class="tex"><b>${esc(w.en)}</b><div class="model" style="font-style:normal">${esc(v||"– nichts geschrieben –")}</div>
      ${used?'<div class="small" style="color:var(--bad)">Das Wort selbst kommt vor. Das gibt im Test Abzug.</div>':""}${v&&short?'<div class="small" style="color:var(--bad)">Sehr kurz. Ein ganzer Satz mit mindestens 6 Wörtern ist sicherer.</div>':""}
      <div class="small muted">Beispiel: ${esc(cap(w.def))}.</div>
      ${v?`<div class="small">Wie gut passt deine Erklärung? Sei ehrlich:</div><div class="row rate" data-k="${k}"><button type="button" data-p="2" ${used?"disabled":""}>✓ passt</button><button type="button" data-p="1">~ halb</button><button type="button" data-p="0">✗ falsch</button></div>`:""}</div>`}).join("");
  let p3pts=0;
  const p3=T.gr.map((g,k)=>{const v=$("g"+k).value, r=v.trim()?ppCheck(g,v):{r:"bad",tip:""}; const p=r.r==="ok"?1:r.r==="near"?.5:0; p3pts+=p; if(p===1) S.pp[g.a]=1;
    return `<div class="tex"><span class="small muted">${g.k==="b"?esc(g.c):esc(g.s)}</span><span>${p===1?MK.ok:p?MK.half:MK.bad} ${esc(v||"–")}</span>${p<1?`<div class="small">richtig: <b>${esc(g.a)}</b>${r.tip?` · ${r.tip}`:""}</div>`:""}</div>`}).join("");
  pts+=p3pts; T.auto=pts;
  app.innerHTML=`
  <header><div class="eyebrow">Probe-Test · Auswertung</div><h1 class="display" style="font-size:28px">Kontrolle</h1></header>
  <section class="card tsec"><h3>1 · Translate the words</h3>${p1}</section>
  <section class="card tsec"><h3>2 · Explain it in English</h3>${p2}</section>
  <section class="card tsec"><h3>3 · Past Perfect</h3>${p3}</section>
  <div id="score"></div>
  <button class="btn-main" id="sum">Punkte zählen</button>`;
  document.querySelectorAll(".rate button").forEach(b=>b.onclick=()=>{const box=b.parentNode;T.rate[+box.dataset.k]=+b.dataset.p;
    box.querySelectorAll("button").forEach(x=>x.classList.toggle("sel",x===b))});
  $("sum").onclick=()=>{
    if(T.rate.some(r=>r===null)){$("score").innerHTML='<div class="fb bad small">Bewerte zuerst alle Erklärungen in Teil 2.</div>';return}
    const total=T.tr.length+T.ex.length*2+T.gr.length, got=T.auto+T.rate.reduce((s,r)=>s+r,0), pct=got/total;
    const lvl=pct>=.85?0:pct>=.7?1:pct>=.5?2:3;
    T.ex.forEach((w,k)=>{if(T.rate[k]===2) S.ex[w.en]=1});
    S.hist.push({d:today(),t:"t",n:total,ok:got,u:S.unit}); save();
    $("sum").remove();
    $("score").innerHTML=`<section class="card result"><div class="eyebrow">Ergebnis</div><div class="score tnum">${got}/${total}</div><div class="muted">Punkte</div>
      <div class="ampel">${["#4CB050","#F6D33C","#F2992E","#D9412F"].map((c,k)=>`<i style="background:${c}" class="${k===lvl?"on":""}">${k===lvl?"✗":""}</i>`).join("")}</div>
      <h2 class="display" style="font-size:22px">${["Sehr stark! So kannst du in den Test gehen.","Gut! Noch ein paar Wörter üben, dann sitzt es.","Schon einiges da. Mach morgen das Tagestraining und dann nochmal den Probe-Test.","Das war erst die Probe. Die falschen Wörter kommen jetzt öfter dran. Morgen wird's besser!"][lvl]}</h2>
      <div class="row" style="width:100%"><button class="btn-main" style="flex:1" id="a">Neuer Probe-Test</button><button class="btn-ghost" id="z">Übersicht</button></div></section>`;
    $("a").onclick=()=>{testStart();scrollTo(0,0)}; $("z").onclick=()=>{home();scrollTo(0,0)};
    $("score").scrollIntoView({behavior:"smooth"}); if(lvl<=1) confetti();
  };
  scrollTo(0,0);
}

/* ---------- daily training ---------- */
function dailyStart(){
  FLOW={i:0,log:[],steps:[()=>startRound(),()=>paraRound(shuffle([...WORDS]).slice(0,1),0,0),()=>gramRound("m",4)]};
  FLOW.steps[0]();
}
function flowNext(r){
  FLOW.log.push(r); FLOW.i++;
  if(FLOW.i<FLOW.steps.length){ scrollTo(0,0); return FLOW.steps[FLOW.i]() }
  const log=FLOW.log; FLOW=null;
  app.innerHTML=`<section class="card result"><div class="eyebrow">Tagestraining geschafft</div><h2 class="display" style="font-size:28px">Stark, Konrad!</h2>
    <div class="dlog">${log.map(l=>`<div><span>${l.name}</span><b class="tnum">${l.name==="Erklären"?"✓":l.ok+" / "+l.n}</b></div>`).join("")}</div>
    <div class="small muted">Morgen wieder, dann bist du fit für den Test.</div>
    <div class="row" style="width:100%"><button class="btn-main" style="flex:1" id="z">Übersicht</button></div></section>`;
  $("z").onclick=home; confetti();
}

/* ---------- speaking ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function say(text,lang,onend){try{const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.9;if(onend)u.onend=onend;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){onend&&onend()}}
// the German word is shown; Konrad says the English word; the answer is only revealed after two misses or on request
function speakRound(){
  const q=shuffle([...WORDS]).slice(0,5); let i=0, ok=0;
  const step=()=>{
    if(i>=q.length){S.hist.push({d:today(),t:"s",n:q.length,ok});save();
      app.innerHTML=`<section class="card result"><div class="eyebrow">Sprech-Training fertig</div><div class="score tnum">${ok}/${q.length}</div><div class="muted">richtig gesagt</div><div class="row" style="width:100%"><button class="btn-main" style="flex:1" id="a">Nochmal</button><button class="btn-ghost" id="b">Übersicht</button></div></section>`;
      $("a").onclick=speakRound;$("b").onclick=home; if(ok>=3) confetti(); return}
    const w=q[i]; let solved=false, tries=0;
    app.innerHTML=`<div class="qhead"><button class="btn-ghost" id="x">✕</button><div class="qbar"><i style="width:${i/q.length*100}%"></i></div><span class="muted small tnum">${i}/${q.length}</span></div>
    <section class="card prompt"><span class="stamp" id="stamp">GELÖST</span><div class="eyebrow">Sag es laut auf Englisch</div>
      <div class="de-word">${esc(w.de)}</div></section>
    <button class="btn-main" id="mic" style="font-size:20px;padding:22px">🎙 Tippen und antworten</button>
    <div id="fb"></div>
    <form id="dict" class="card" style="display:grid;gap:8px" autocomplete="off">
      <label for="dictIn" id="dictLbl" class="small muted">Kommt nichts? Tipp hier ins Feld, dann auf das <b>🎙 unten rechts auf der Tastatur</b> und sprich.</label>
      <input class="answer" id="dictIn" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="hier sprechen">
      <button class="btn-ghost">Prüfen</button>
    </form>
    <button class="btn-ghost" id="skip">Weiß ich nicht</button>`;
    $("x").onclick=()=>{speechSynthesis.cancel();home()};
    const fb=$("fb"), mic=$("mic");
    const next=()=>{speechSynthesis.cancel();i++;step()};
    const finish=()=>{$("skip").hidden=true;$("dict").hidden=true;mic.hidden=false;mic.disabled=false;mic.textContent="Weiter →"};
    mic.onclick=()=>{if(solved)next()};
    const reveal=intro=>{solved=true;
      fb.innerHTML=`<div class="fb bad"><div class="small">${intro}</div><div class="right">${esc(w.en)}</div></div>`;
      say(w.en,"en-GB"); finish()};
    $("skip").onclick=()=>reveal("Kein Problem. So heißt es:");
    // one place that judges what was heard (from the mic button or keyboard dictation)
    const judge=alts=>{
      if(solved) return;
      alts=alts.map(a=>a.replace(/[.,!?]/g,"").replace(/\bi d\b/i,"ID").trim()).filter(Boolean);
      if(!alts.length) return;
      const hit=alts.find(a=>check(w,a).r==="ok")||alts.find(a=>check(w,a).r==="near");
      tries++;
      if(hit){solved=true;ok++;$("stamp").classList.add("show");
        fb.innerHTML=`<div class="fb ok"><b>${pick(["Gut gesagt!","Richtig!","Volltreffer!"])}</b> <span class="right">${esc(w.en)}</span></div>`;
        say("Right! "+w.en,"en-GB"); finish();
      } else if(tries<2){
        fb.innerHTML=`<div class="fb bad"><div class="small">Ich habe „${esc(alts[0])}“ verstanden. Das ist es noch nicht.</div><div class="small muted" style="margin-top:4px">Probier es nochmal.</div></div>`;
      } else reveal(`Ich habe „${esc(alts[0])}“ verstanden. Richtig wäre:`);
    };
    $("dict").onsubmit=e=>{e.preventDefault();const v=$("dictIn").value;$("dictIn").value="";judge([v])};
    // home-screen apps on iPhone often hang in web speech recognition: use keyboard dictation there
    const standalone=navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;
    const useField=()=>{mic.hidden=true;$("dictLbl").innerHTML="Tipp ins Feld, dann auf das <b>🎙 unten rechts auf der Tastatur</b> und sag das Wort auf Englisch.";$("dictIn").focus()};
    if(!SR||standalone){useField();return}
    mic.onclick=()=>{
      if(solved) return next();
      speechSynthesis.cancel();
      let heard=[], got=false;
      const rec=new SR(); rec.lang="en-GB"; rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=5;
      mic.disabled=true; mic.textContent="Ich höre zu … jetzt sprechen"; fb.innerHTML="";
      let ended=false;
      const timer=setTimeout(()=>{try{rec.stop()}catch(e){}},6000);
      // watchdog: if the phone never reports back, give up and switch to keyboard dictation
      const dog=setTimeout(()=>{if(ended||solved)return;try{rec.abort()}catch(e){}
        fb.innerHTML='<div class="fb bad small">Das Mikrofon antwortet auf diesem Handy nicht. Nimm das Feld: reintippen, dann 🎙 auf der Tastatur.</div>';useField()},9000);
      rec.onresult=e=>{
        heard=[];for(const r of e.results)for(const a of r)heard.push(a.transcript);
        if(heard.some(a=>check(w,a.replace(/[.,!?]/g,"")).r==="ok")){got=true;try{rec.abort()}catch(_){};judge(heard)}
        else if([...e.results].some(r=>r.isFinal)){got=true;judge(heard)}
      };
      rec.onerror=e=>{got=true;clearTimeout(timer);
        fb.innerHTML=`<div class="fb bad small">${e.error==="not-allowed"||e.error==="service-not-allowed"?"Das Mikrofon oder die Diktierfunktion ist nicht erlaubt. Nutze das Feld unten mit dem 🎙 der Tastatur.":e.error==="no-speech"?"Ich habe nichts gehört. Sprich etwas lauter, oder nutze das Feld unten.":"Das hat nicht geklappt. Nutze das Feld unten mit dem 🎙 der Tastatur."}</div>`};
      rec.onend=()=>{ended=true;clearTimeout(timer);clearTimeout(dog);
        if(!got){ if(heard.length) judge(heard);
          else fb.innerHTML='<div class="fb bad small">Ich habe nichts mitbekommen. Nutze das Feld unten: reintippen, dann 🎙 auf der Tastatur.</div>'}
        if(!solved){mic.disabled=false;mic.textContent="🎙 Nochmal antworten"}};
      try{rec.start()}catch(err){got=true;rec.onend()}
    };
  };
  step();
}

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=$("confetti"),x=c.getContext("2d"); c.width=innerWidth*devicePixelRatio; c.height=innerHeight*devicePixelRatio; x.scale(devicePixelRatio,devicePixelRatio);
  const cs=getComputedStyle(document.documentElement), cols=["--hi","--blue","--ok","--bad"].map(v=>cs.getPropertyValue(v).trim());
  const P=[...Array(120)].map(()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:Math.random()*-12-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,innerWidth,innerHeight);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
    if(++f<110) requestAnimationFrame(tick); else x.clearRect(0,0,innerWidth,innerHeight)})();
}

home();
</script>

</body>
